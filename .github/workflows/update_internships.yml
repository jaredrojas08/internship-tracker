name: Update Internship Listings

on:
  schedule:
    # Hourly at :20. GitHub's scheduler is best-effort and can lag under load.
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'Send a test digest and exit (does not touch the sheet)'
        type: boolean
        default: false

# The job commits removed.json and digest_state.json back to the branch.
permissions:
  contents: write

# An overlapping run would race on the Notion write and the state commit.
# Queue instead of cancel: a run mid-batch should finish, not be killed.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run internship tracker
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # Digest delivery. Set whichever you want; unset means no digest,
          # and the run works normally either way.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          if [ "${{ inputs.test_notify }}" = "true" ]; then
            python internship_tracker.py --test-notify
          else
            python internship_tracker.py --notion
          fi

      - name: Commit updated state files
        run: |
          set -euo pipefail
          # Commits are authored as Jared: this is his automation acting on his
          # own repo, and the message makes the automation explicit.
          git config user.name "jaredrojas08"
          git config user.email "jaredrojas08@gmail.com"

          # digest_state.json only exists once a digest has fired; guard the add.
          for f in removed.json digest_state.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nothing changed; skipping commit."
            exit 0
          fi

          git commit -m "chore: update tracker state"
          git push
